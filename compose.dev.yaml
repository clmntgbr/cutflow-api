services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/livez"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    ports:
      - "4000:3000"
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      CENTRIFUGO_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL:-ws://localhost:8000/connection/websocket}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks:
      - api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: worker
    command: ["go", "run", "./cmd/worker"]
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      CENTRIFUGO_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL:-ws://localhost:8000/connection/websocket}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - api
    restart: unless-stopped

  extraction:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: extraction
    command: ["go", "run", "./cmd/extraction"]
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      EXTRACTION_QUEUE: ${EXTRACTION_QUEUE:-extraction}
      EXTRACTION_ROUTING_KEY: ${EXTRACTION_ROUTING_KEY:-media_file.ready.v1}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-5}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - api
    restart: unless-stopped

  silence:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: silence
    command: ["go", "run", "./cmd/silence"]
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      SILENCE_QUEUE: ${SILENCE_QUEUE:-silence}
      SILENCE_ROUTING_KEY: ${SILENCE_ROUTING_KEY:-media_file.silence_requested.v1}
      SILENCE_CONCURRENCY: ${SILENCE_CONCURRENCY:-5}
      SILENCE_THRESHOLD_DB: "${SILENCE_THRESHOLD_DB:--35}"
      SILENCE_MIN_DURATION_MS: ${SILENCE_MIN_DURATION_MS:-400}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - api
    restart: unless-stopped

  transcript:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: transcript
    command: ["go", "run", "./cmd/transcript"]
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      TRANSCRIPT_QUEUE: ${TRANSCRIPT_QUEUE:-transcript}
      TRANSCRIPT_ROUTING_KEY: ${TRANSCRIPT_ROUTING_KEY:-media_file.transcript_requested.v1}
      TRANSCRIPT_CONCURRENCY: ${TRANSCRIPT_CONCURRENCY:-5}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      TRANSCRIPT_USE_FIXTURES: ${TRANSCRIPT_USE_FIXTURES:-true}
      TRANSCRIPT_FIXTURE_JSON: ${TRANSCRIPT_FIXTURE_JSON:-fixtures/transcript.json}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - api
    restart: unless-stopped

  database:
    container_name: datastore
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "9543:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - api
    restart: unless-stopped

  rabbitmq:
    container_name: broker
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9002:5672"
      - "9003:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-password}
    networks:
      - api
    restart: unless-stopped

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    command: ["centrifugo", "-c", "config.json"]
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo:/centrifugo:ro
    working_dir: /centrifugo
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000 http://localhost:3001}
    networks:
      - api
    restart: unless-stopped
  
  minio:
    container_name: s3
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://127.0.0.1:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && mc ready local",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: devuser
      MINIO_ROOT_PASSWORD: devpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - api
    restart: unless-stopped

  mc:
    container_name: mc
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-media}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:-dev-minio-webhook-secret}
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 'waiting for minio...';
      until mc alias set myminio http://minio:9000 devuser devpassword; do sleep 1; done;
      mc mb myminio/$${STORAGE_BUCKET} --ignore-existing;
      echo 'waiting for api webhook endpoint...';
      until mc admin config set myminio notify_webhook:analyze endpoint='http://api:3000/webhooks/minio/object-created' auth_token=\"$${MINIO_WEBHOOK_SECRET}\"; do
        echo 'api not ready for webhook, retrying...';
        sleep 2;
      done;
      mc admin service restart myminio --json;
      sleep 5;
      until mc alias set myminio http://minio:9000 devuser devpassword; do sleep 1; done;
      mc event remove myminio/$${STORAGE_BUCKET} --force || true;
      until mc event add myminio/$${STORAGE_BUCKET} arn:minio:sqs::analyze:webhook --event put --prefix videos/ --suffix original.mp4 -p; do
        echo 'event ARN not ready, retrying...';
        sleep 2;
      done;
      echo 'minio webhook bootstrap complete';
      mc event list myminio/$${STORAGE_BUCKET};
      "
    networks:
      - api

  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:latest
    command: http --url=choice-pretty-leech.ngrok-free.app --host-header=choice-pretty-leech.ngrok-free.app http://api:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    networks:
      - api
    restart: unless-stopped

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - "9025:1025"
      - "9026:8025"
    networks:
      - api
    restart: unless-stopped

volumes:
  go-modules:
  minio_data:
  go-build-cache:
  database_data:

networks:
  api:
    name: go
